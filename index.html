<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <link rel="preload" href="fonts/Monocraft.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scene.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" data-mode="focus" data-final="none">
    <div class="stage">
      <div class="screen">
        <!-- Cena montada por js/scene.js a partir de js/art.js -->
        <svg class="scene" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img"
             aria-label="Casa de blocos em pixel art com um personagem trabalhando na mesa de trabalho"></svg>
        <div class="vignette" aria-hidden="true"></div>

        <button id="open-settings" class="settings-btn mc-btn" type="button">Opções...</button>

      </div>

      <!-- HUD no layout do jogo: corações e comida, nível (tempo), barra de experiência e hotbar de 9 slots -->
      <div class="hud">
        <div id="now-playing" class="now-playing" aria-live="polite" hidden></div>
        <div class="status">
          <div id="cycles" class="cycles" role="img" aria-label="Progresso do ciclo"></div>
          <div id="hunger" class="hunger" role="img" aria-label="Andamento da pausa"></div>
        </div>
        <span id="time" class="time">25:00</span>
        <div id="xp" class="xp" role="progressbar" aria-label="Progresso do bloco" aria-valuemin="0" aria-valuemax="100"><div class="xp-fill"></div></div>
        <div class="timer-bar hotbar">
          <span class="mode-icon hotbar-slot selected" aria-hidden="true">
            <span class="icon icon-focus" data-icon="pickaxe"></span>
            <span class="icon icon-short" data-icon="bread"></span>
            <span class="icon icon-long" data-icon="bed"></span>
          </span>
          <button id="toggle" class="ctrl ctrl-toggle hotbar-slot" type="button" data-state="paused" aria-label="Iniciar">
            <span class="i-play" data-icon="play"></span>
            <span class="i-pause" data-icon="pause"></span>
          </button>
          <button id="reset" class="ctrl ctrl-reset hotbar-slot" type="button" aria-label="Reiniciar bloco">
            <span data-icon="stop"></span>
          </button>
          <button id="skip" class="ctrl ctrl-skip hotbar-slot" type="button" aria-label="Pular para o próximo bloco">
            <span data-icon="skip"></span>
          </button>
          <span class="hotbar-slot deco" aria-hidden="true"><span data-icon="sword"></span></span>
          <span class="hotbar-slot deco" aria-hidden="true"><span data-icon="apple"></span></span>
          <span class="hotbar-slot deco" aria-hidden="true"><span data-icon="torch"></span></span>
          <span class="hotbar-slot deco" aria-hidden="true"><span data-icon="book"></span></span>
          <span class="hotbar-slot deco" aria-hidden="true"><span data-icon="grass"></span></span>
        </div>
      </div>

      <label class="chat">
        <span class="chat-name">&lt;Você&gt;</span>
        <input id="activity" class="activity" type="text" maxlength="80" autocomplete="off"
               placeholder="qual a tarefa?" aria-label="Atividade">
      </label>
    </div>

    <dialog id="settings" class="panel" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog" novalidate>
        <h2 id="settings-title">Configurações</h2>
        <label class="field">Foco (min) <input name="focusMin" type="number" min="1" max="120" inputmode="numeric"></label>
        <label class="field">Pausa curta (min) <input name="shortMin" type="number" min="1" max="60" inputmode="numeric"></label>
        <label class="field">Pausa longa (min) <input name="longMin" type="number" min="1" max="60" inputmode="numeric"></label>
        <label class="field">Focos até a pausa longa <input name="cyclesBeforeLong" type="number" min="1" max="12" inputmode="numeric"></label>
        <label class="field">Iniciar próximo automaticamente <input name="autoStart" type="checkbox"></label>
        <label class="field">Som <input name="sound" type="checkbox"></label>
        <label class="field">Volume <input name="volume" type="range" min="0" max="100"></label>
        <label class="field">Notificações <input name="notifications" type="checkbox"></label>
        <label class="field">Música
          <select name="musicMode">
            <option value="focus">Só no foco</option>
            <option value="always">Foco e pausas</option>
            <option value="off">Desligada</option>
          </select>
        </label>
        <label class="field">Volume da música <input name="musicVolume" type="range" min="0" max="100"></label>
        <small id="music-info" class="sky-info"></small>
        <p id="notif-hint" class="hint" hidden>O navegador não permitiu notificações.</p>
        <div class="sky-row">
          <span>Céu no horário real</span>
          <small id="sky-info" class="sky-info"></small>
          <button id="use-location" type="button" class="mc-btn">Usar minha localização</button>
          <p id="location-hint" class="hint" hidden>Não foi possível obter a localização. Usando 6h–18h.</p>
        </div>
        <div class="actions">
          <button type="submit" value="cancel" class="mc-btn">Cancelar</button>
          <button type="submit" value="save" class="mc-btn primary">Salvar</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
