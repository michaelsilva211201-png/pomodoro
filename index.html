<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scene.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" data-mode="focus" data-final="none">
    <div class="stage">
      <div class="screen">
        <!-- Cena montada por js/scene.js a partir de js/art.js -->
        <svg class="scene" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img"
             aria-label="Casinha de madeira em pixel art com um personagem trabalhando na bancada"></svg>

        <button id="open-settings" class="settings-btn slot" type="button" aria-label="Configurações">
          <span data-icon="gear"></span>
        </button>
      </div>

      <div class="hud">
        <div class="timer-bar panel">
          <span class="mode-icon slot" aria-hidden="true">
            <span class="icon icon-focus" data-icon="pickaxe"></span>
            <span class="icon icon-short" data-icon="mug"></span>
            <span class="icon icon-long" data-icon="moon"></span>
          </span>
          <span id="time" class="time">25:00</span>
          <button id="toggle" class="ctrl ctrl-toggle slot" type="button" data-state="paused" aria-label="Iniciar">
            <span class="i-play" data-icon="play"></span>
            <span class="i-pause" data-icon="pause"></span>
          </button>
          <button id="reset" class="ctrl ctrl-reset slot" type="button" aria-label="Reiniciar bloco">
            <span data-icon="stop"></span>
          </button>
          <button id="skip" class="ctrl ctrl-skip slot" type="button" aria-label="Pular para o próximo bloco">
            <span data-icon="skip"></span>
          </button>
        </div>
      </div>

      <div id="cycles" class="cycles panel" role="img" aria-label="Progresso do ciclo"></div>

      <input id="activity" class="activity panel" type="text" maxlength="80" autocomplete="off"
             placeholder="No que você vai focar?" aria-label="Atividade">
    </div>

    <dialog id="settings" class="panel" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog" novalidate>
        <h2 id="settings-title">Configurações</h2>
        <label class="field">Foco (min) <input name="focusMin" type="number" min="1" max="120" inputmode="numeric"></label>
        <label class="field">Pausa curta (min) <input name="shortMin" type="number" min="1" max="60" inputmode="numeric"></label>
        <label class="field">Pausa longa (min) <input name="longMin" type="number" min="1" max="60" inputmode="numeric"></label>
        <label class="field">Focos até a pausa longa <input name="cyclesBeforeLong" type="number" min="1" max="12" inputmode="numeric"></label>
        <label class="field">Iniciar próximo automaticamente <input name="autoStart" type="checkbox"></label>
        <label class="field">Som <input name="sound" type="checkbox"></label>
        <label class="field">Volume <input name="volume" type="range" min="0" max="100"></label>
        <label class="field">Notificações <input name="notifications" type="checkbox"></label>
        <p id="notif-hint" class="hint" hidden>O navegador não permitiu notificações.</p>
        <div class="sky-row">
          <span>Céu no horário real</span>
          <small id="sky-info" class="sky-info"></small>
          <button id="use-location" type="button" class="slot">Usar minha localização</button>
          <p id="location-hint" class="hint" hidden>Não foi possível obter a localização. Usando 6h–18h.</p>
        </div>
        <div class="actions">
          <button type="submit" value="cancel" class="slot">Cancelar</button>
          <button type="submit" value="save" class="slot primary">Salvar</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
